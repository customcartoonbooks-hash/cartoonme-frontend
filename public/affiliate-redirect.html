<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 24px;
      margin: 0;
    }
    p {
      opacity: 0.9;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>Redirecting to MasterpieceMe...</h2>
    <p>Creating your personalized book</p>
  </div>

  <script>
    // Extract affiliate code from URL path
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const affiliateCode = pathParts[0]; // e.g., "TEST2025" from "/TEST2025"
    
    // Redirect to home page with ref parameter
    if (affiliateCode) {
      const homeUrl = `${window.location.origin}?ref=${affiliateCode}`;
      console.log(`🎯 Redirecting with affiliate code: ${affiliateCode}`);
      window.location.href = homeUrl;
    } else {
      // No code found, just go to home
      window.location.href = window.location.origin;
    }
  </script>
</body>
</html>
